  <style>
    .search-hero {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 50px 5vw 60px;
      text-align: center;
      color: white;
    }
    .search-hero h1 { color: white; margin-bottom: 8px; }
    .search-hero p { opacity: 0.85; font-size: 16px; margin-bottom: 0; }
    
    .search-box-wrap {
      max-width: 640px;
      margin: -30px auto 0;
      padding: 0 5vw;
      position: relative;
      z-index: 10;
    }
    .search-box-inner {
      display: flex;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      overflow: hidden;
    }
    .search-box-inner input {
      flex: 1;
      border: none;
      padding: 16px 20px;
      font-size: 16px;
      outline: none;
      background: transparent;
    }
    .search-box-inner button {
      padding: 16px 28px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .search-box-inner button:hover { opacity: 0.9; }
    .search-box-inner button:disabled { opacity: 0.5; cursor: not-allowed; }

    .filter-bar {
      max-width: 640px;
      margin: 16px auto 0;
      padding: 0 5vw;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .filter-chip {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid #ddd;
      background: white;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-chip.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .results-section {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 5vw 40px;
    }
    .result-empty {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    .result-empty .icon { font-size: 48px; margin-bottom: 16px; }
    .result-db-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 0 10px;
      font-size: 15px;
      font-weight: bold;
    }
    .result-item {
      background: white;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      border-left: 4px solid #667eea;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 13px;
      line-height: 1.7;
    }
    .result-item:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.1); transform: translateX(2px); }
    .result-item mark { background: #fff176; padding: 1px 3px; border-radius: 2px; }
    .result-path { font-size: 11px; color: #999; margin-top: 4px; }
    .result-count { font-size: 12px; color: #888; margin-left: 8px; font-weight: normal; }

    .quick-links {
      max-width: 800px;
      margin: 30px auto 40px;
      padding: 0 5vw;
    }
    .quick-links h3 { text-align: center; color: #666; font-size: 14px; margin-bottom: 16px; }
    .quick-link-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .quick-link {
      padding: 8px 16px;
      background: #f0f4ff;
      border-radius: 20px;
      font-size: 13px;
      color: #667eea;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .quick-link:hover { background: #667eea; color: white; }

    .loading-spinner {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    /* ── 增强搜索：最近搜索、年级筛选、无结果推荐 ── */
    .recent-searches {
      max-width: 700px;
      margin: 0 auto 12px;
      display: none;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 0 16px;
    }
    .recent-searches.visible { display: flex; }
    .recent-searches .recent-label {
      font-size: 11px;
      color: #999;
      margin-right: 4px;
      white-space: nowrap;
    }
    .recent-tag {
      display: inline-block;
      padding: 3px 10px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      font-size: 11px;
      color: #555;
      cursor: pointer;
      transition: all 0.15s;
    }
    .recent-tag:hover { background: #eef2ff; border-color: #667eea; color: #4f46e5; }
    .recent-clear {
      font-size: 10px;
      color: #bbb;
      cursor: pointer;
      margin-left: 4px;
    }
    .recent-clear:hover { color: #f44336; }

    .grade-filter-bar {
      max-width: 700px;
      margin: 0 auto 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 0 16px;
    }
    .grade-filter-bar .gf-label {
      font-size: 12px;
      color: #999;
      line-height: 26px;
      white-space: nowrap;
    }
    .grade-filter-chip {
      display: inline-block;
      padding: 2px 10px;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      font-size: 11px;
      color: #888;
      cursor: pointer;
      background: white;
      transition: all 0.15s;
    }
    .grade-filter-chip:hover { border-color: #667eea; color: #4f46e5; }
    .grade-filter-chip.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .suggested-search {
      margin-top: 16px;
      text-align: center;
    }
    .suggested-search p {
      font-size: 12px;
      color: #999;
      margin-bottom: 8px;
    }
    .suggested-tag {
      display: inline-block;
      margin: 3px;
      padding: 5px 14px;
      background: #f8f9ff;
      border: 1px solid #dde1f0;
      border-radius: 16px;
      font-size: 12px;
      color: #4f46e5;
      cursor: pointer;
      transition: all 0.2s;
    }
    .suggested-tag:hover {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    @media (max-width: 600px) {
      .recent-searches, .grade-filter-bar { padding: 0 8px; gap: 4px; }
      .recent-tag, .grade-filter-chip { font-size: 10px; padding: 2px 8px; }
    }
  </style>

    <div class="recent-searches" id="recentSearches">
      <span class="recent-label">最近：</span>

        <p style="font-size:12px;color:#bbb;">语法知识 · 词语学习 · 文学常识 · 常见错误 · 范文方法 · 练习题库</p>

  <script>
    var currentFilter = 'all';
    var currentGrade = 'all';
    var RECENT_KEY = 'searchRecent';
    var MAX_RECENT = 8;

    function escapeHTML(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── 同义词/关联词映射（无结果时推荐） ──
    var RELATED_TERMS = {
      '比喻': ['修辞', '拟人', '排比', '夸张'],
      '李白': ['唐诗', '杜甫', '静夜思', '望庐山瀑布'],
      '病句': ['修改病句', '语病', '搭配不当', '语法'],
      '成语': ['四字词语', '典故', '寓言', '成语故事'],
      '修辞': ['比喻', '拟人', '排比', '夸张', '反问'],
      '唐诗': ['李白', '杜甫', '古诗', '绝句'],
      '标点': ['逗号', '句号', '引号', '分号'],
      '缩句': ['扩句', '缩句练习', '句子成分'],
      '四大名著': ['西游记', '三国演义', '水浒传', '红楼梦'],
      '读后感': ['读书笔记', '心得体会', '写作方法'],
      '近义词': ['反义词', '同义词', '词语辨析'],
      '拼音': ['声母', '韵母', '整体认读', '声调'],
      '作文': ['写作', '范文', '写人', '记事', '写景'],
      '阅读': ['阅读理解', '概括', '赏析', '中心思想']
    };
    // 所有快捷搜索词
    var ALL_QUICK_TERMS = Object.keys(RELATED_TERMS);

    // ── 最近搜索 ──
    function getRecentSearches() {
      try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); }
      catch(e) { return []; }
    }
    function saveRecentSearch(keyword) {
      var recent = getRecentSearches();
      recent = recent.filter(function(r) { return r !== keyword; });
      recent.unshift(keyword);
      if (recent.length > MAX_RECENT) recent.length = MAX_RECENT;
      localStorage.setItem(RECENT_KEY, JSON.stringify(recent));
      renderRecentSearches();
    }
    function renderRecentSearches() {
      var container = document.getElementById('recentSearches');
      var tagsEl = document.getElementById('recentTags');
      var recent = getRecentSearches();
      if (recent.length === 0) {
        container.classList.remove('visible');
        return;
      }
      container.classList.add('visible');
      var html = '';
      recent.forEach(function(kw) {
        html += '<span class="recent-tag" data-kw="' + escapeHTML(kw) + '">' + escapeHTML(kw) + '</span>';
      });
      tagsEl.innerHTML = html;
    }
    // 最近搜索点击
    document.getElementById('recentTags').addEventListener('click', function(e) {
      var tag = e.target.closest('.recent-tag');
      if (!tag || !tag.dataset.kw) return;
      document.getElementById('searchInput').value = tag.dataset.kw;
      doSearch();
    });
    // 清除最近搜索
    document.getElementById('clearRecent').addEventListener('click', function() {
      localStorage.removeItem(RECENT_KEY);
      renderRecentSearches();
    });

    // ── 过滤器点击（资料库） ──
    document.getElementById('filterBar').addEventListener('click', function(e) {
      var chip = e.target.closest('.filter-chip');
      if (!chip) return;
      document.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
      chip.classList.add('active');
      currentFilter = chip.dataset.type;
      var q = document.getElementById('searchInput').value.trim();
      if (q) doSearch();
    });

    // ── 年级筛选 ──
    document.getElementById('gradeFilterBar').addEventListener('click', function(e) {
      var chip = e.target.closest('.grade-filter-chip');
      if (!chip) return;
      document.querySelectorAll('.grade-filter-chip').forEach(function(c) { c.classList.remove('active'); });
      chip.classList.add('active');
      currentGrade = chip.dataset.grade;
      var q = document.getElementById('searchInput').value.trim();
      if (q) doSearch();
    });

    // ── 回车搜索 + / 快捷键 ──
    document.getElementById('searchInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { doSearch(); }
      if (e.key === 'Escape') { this.value = ''; this.focus(); }
    });
    // 全局 / 快捷键聚焦搜索框
    document.addEventListener('keydown', function(e) {
      if (e.key === '/' && document.activeElement !== document.getElementById('searchInput') &&
          e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
    });

    // ── 快速搜索按钮 ──
    document.querySelector('.quick-link-grid').addEventListener('click', function(e) {
      var btn = e.target.closest('.quick-link');
      if (!btn || !btn.dataset.keyword) return;
      document.getElementById('searchInput').value = btn.dataset.keyword;
      doSearch();
    });

    // ── 搜索按钮 ──
    document.getElementById('searchBtn').addEventListener('click', function() { doSearch(); });

    function getTypeLabel(type) {
      var labels = {
        grammar: '📚 语法知识',
        vocabulary: '📝 词语学习',
        literary: '📖 文学常识',
        mistake: '⚠️ 常见错误',
        essay: '🏆 作文方法',
        exercise: '✏️ 练习题库'
      };
      return labels[type] || type;
    }

    function getGradeLabel(grade) {
      if (!grade || grade === 0 || grade === '0') return '通用';
      return grade + '年级';
    }

    function getItemGradeLabel(item) {
      return item.gradeRange || getGradeLabel(item.grade);
    }

    function getDifficultyLabel(difficulty) {
      var labels = {
        basic: '基础',
        improve: '提高',
        advanced: '拔尖',
        exam: '小升初'
      };
      return labels[difficulty] || difficulty || '';
    }

    // ── 无结果推荐 ──
    function getSuggestions(keyword) {
      var suggestions = [];
      // 1. 从 RELATED_TERMS 找关联词
      var related = RELATED_TERMS[keyword];
      if (related) {
        related.forEach(function(r) { suggestions.push(r); });
      }
      // 2. 部分匹配的快捷搜索词
      ALL_QUICK_TERMS.forEach(function(term) {
        if (term !== keyword && term.indexOf(keyword) >= 0 && suggestions.indexOf(term) < 0) {
          suggestions.push(term);
        }
      });
      // 3. 补充默认热词
      if (suggestions.length < 3) {
        ['修辞手法', '修改病句', '成语故事', '古诗', '阅读理解'].forEach(function(t) {
          if (suggestions.indexOf(t) < 0 && t !== keyword) suggestions.push(t);
        });
      }
      return suggestions.slice(0, 6);
    }

    // ── 主搜索函数 ──
    function doSearch() {
      var keyword = document.getElementById('searchInput').value.trim();
      if (!keyword) return;
      
      var resultsEl = document.getElementById('results');
      resultsEl.innerHTML = '<div class="loading-spinner">⏳ 正在搜索六大资料库...</div>';

      var searchBtn = document.getElementById('searchBtn');
      searchBtn.disabled = true;
      searchBtn.textContent = '搜索中...';

      var options = {
        type: currentFilter === 'all' ? null : currentFilter,
        grade: currentGrade
      };

      DataLib.searchIndex(keyword, options).then(function(allResults) {
        searchBtn.disabled = false;
        searchBtn.textContent = '搜索';

        // 保存到最近搜索
        saveRecentSearch(keyword);

        if (!allResults || allResults.length === 0) {
          var suggestions = getSuggestions(keyword);
          var suggestHtml = '';
          if (suggestions.length > 0) {
            suggestHtml = '<div class="suggested-search"><p>试试这些相关内容：</p>';
            suggestions.forEach(function(s) {
              suggestHtml += '<span class="suggested-tag" data-kw="' + escapeHTML(s) + '">' + escapeHTML(s) + '</span>';
            });
            suggestHtml += '</div>';
          }
          resultsEl.innerHTML = '<div class="result-empty"><div class="icon">🔍</div><p>没有找到「' + escapeHTML(keyword) + '」相关的内容</p><p style="font-size:12px;color:#bbb;">试试调整年级筛选或换个关键词？</p>' + suggestHtml + '</div>';

          // 绑定推荐词点击
          setTimeout(function() {
            document.querySelectorAll('.suggested-tag').forEach(function(tag) {
              tag.addEventListener('click', function() {
                document.getElementById('searchInput').value = tag.dataset.kw;
                doSearch();
              });
            });
          }, 50);
          return;
        }

        // 按资料类型分组
        var grouped = {};

        allResults.forEach(function(r) {
          if (!grouped[r.type]) grouped[r.type] = [];
          grouped[r.type].push(r);
        });

        var gradeLabel = currentGrade === 'all' ? '' : ' · ' + currentGrade + '年级';
        var html = '<p style="color:#888;font-size:13px;text-align:center;margin-bottom:16px;">找到 <strong>' + allResults.length + '</strong> 条与「<strong>' + escapeHTML(keyword) + '</strong>」相关的结果' + gradeLabel + '</p>';

        Object.keys(grouped).forEach(function(type) {
          var items = grouped[type];
          html += '<div class="result-db-label">' + getTypeLabel(type) + '<span class="result-count">' + items.length + '条</span></div>';
          
          items.slice(0, 20).forEach(function(item) {
            var summaryText = item.summary || item.content || item.title;
            summaryText = String(summaryText).substring(0, 150);
            var metaParts = [getItemGradeLabel(item), item.category, getDifficultyLabel(item.difficulty)].filter(Boolean);
            html += '<div class="result-item">' +
              '<div><strong>' + highlightText(item.title, keyword) + '</strong></div>' +
              '<div>' + highlightText(summaryText, keyword) + '</div>' +
              '<div class="result-path">' + escapeHTML(metaParts.join(' · ')) + ' · ' + escapeHTML(item.source || '') + '</div>' +
            '</div>';
          });

          if (items.length > 20) {
            html += '<p style="color:#999;font-size:12px;text-align:center;">... 还有 ' + (items.length - 20) + ' 条结果</p>';
          }
        });

        resultsEl.innerHTML = html;
      }).catch(function(err) {
        searchBtn.disabled = false;
        searchBtn.textContent = '搜索';
        resultsEl.innerHTML = '<div class="result-empty"><div class="icon">⚠️</div><p>搜索出错，请稍后再试</p></div>';
        console.error(err);
      });
    }

    function highlightText(text, keyword) {
      var escaped = escapeHTML(text);
      var safeKeyword = escapeHTML(keyword).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return escaped.replace(new RegExp('(' + safeKeyword + ')', 'gi'), '<mark>$1</mark>');
    }

    // 初始化最近搜索
    renderRecentSearches();
  </script>

  <script defer src="data/data-loader-global.js?v=96"></script>
